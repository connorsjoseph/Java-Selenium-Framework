name: SauceDemo Automation Suite

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      suite_file:
        description: "TestNG suite file to run"
        required: false
        default: "testng-chrome-only.xml"
        type: choice
        options:
          - testng-chrome-only.xml
          - testng.xml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run automated tests (headless)
        env:
          HEADLESS: "true"
        run: >
          mvn clean test
          -DsuiteXmlFile=${{ github.event.inputs.suite_file || 'testng-chrome-only.xml' }}
          -Dheadless=true
        continue-on-error: true
        id: run_tests

      - name: Upload ExtentReport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/ExtentReport.html
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Prepare report for GitHub Pages
        if: always()
        run: |
          mkdir -p public
          cp target/ExtentReport.html public/index.html
    
      - name: Fail workflow if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1